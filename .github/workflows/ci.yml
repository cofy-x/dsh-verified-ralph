name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24', '22.19.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 runtime
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10, Node 24 runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 runtime
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:peers
      - run: pnpm run verify:self-contained
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run prepare
      - run: node --input-type=module -e "import('./lib/index.js').then((m) => { if (m.default || m.name !== 'dsh-verified-ralph') process.exit(1) })"

  git-install-smoke:
    name: git-install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 runtime
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10, Node 24 runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 runtime
        with:
          node-version: 24
      - name: Install exact Git revision
        env:
          INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          INSTALL_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: node scripts/git-install-smoke.mjs --ref "$INSTALL_REF" --repository "$INSTALL_REPOSITORY"

  dsh-contract:
    name: dsh-contract (dsh-v0.1.5-rc.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 runtime
        with:
          repository: deepseek-ai/deepseek-harness
          ref: fb2c4b9e698e30edb738bca4cf0618587db7d203
          path: .dsh-compat
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10, Node 24 runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 runtime
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Verify audited DSH source contract
        env:
          DSH_SOURCE_DIR: .dsh-compat
          DSH_SOURCE_COMMIT: fb2c4b9e698e30edb738bca4cf0618587db7d203
        run: pnpm run check:dsh-contract

  profile-install-smoke:
    name: profile-install-smoke (web, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 runtime
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10, Node 24 runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 runtime
        with:
          node-version: 24
      - name: Install both verifier plugins into current DSH profiles
        env:
          INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          INSTALL_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: node scripts/profile-install-smoke.mjs --ref "$INSTALL_REF" --repository "$INSTALL_REPOSITORY"

  required:
    name: required
    if: ${{ always() }}
    needs: [quality, git-install-smoke, dsh-contract, profile-install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SMOKE_RESULT: ${{ needs.git-install-smoke.result }}
          CONTRACT_RESULT: ${{ needs.dsh-contract.result }}
          PROFILE_RESULT: ${{ needs.profile-install-smoke.result }}
        run: test "$QUALITY_RESULT" = success && test "$SMOKE_RESULT" = success && test "$CONTRACT_RESULT" = success && test "$PROFILE_RESULT" = success
